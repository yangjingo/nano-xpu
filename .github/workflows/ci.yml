name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/ci/requirements.txt
      - run: python -m pip install -r .github/ci/requirements.txt
      - name: Check Python errors
        run: |
          python -m ruff check .
          python -m compileall -q nanoxpu tests .github/ci
          python -m unittest discover -s .github/ci -p 'test_*.py' -v
      - name: Check workflow syntax
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  cpu:
    name: cpu (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tests/requirements-cpu.txt
            .github/ci/requirements.txt
            pyproject.toml
      - name: Install CPU dependencies and wheel
        run: |
          python -m pip install -r .github/ci/requirements.txt -r tests/requirements-cpu.txt
          python -m build --wheel --no-isolation
          python -m pip install --no-deps dist/*.whl
          mkdir -p artifacts
          python -m pip freeze > artifacts/installed.txt
      - name: Extract documented examples to a temporary directory
        run: python tests/helpers/examples.py "$RUNNER_TEMP/nano-examples"
      - name: Smoke test the installed package outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('torch', 'transformers', 'triton', 'flash_attn'))"
          python -c "import importlib.metadata as m, importlib.util as u; import nanoxpu; from pathlib import Path; import os; assert not Path(nanoxpu.__file__).is_relative_to(Path(os.environ['GITHUB_WORKSPACE'])); assert u.find_spec('nanovllm') is None; assert m.distribution('nano-xpu').metadata['Name'] == 'nano-xpu'; assert next(e for e in m.distribution('nano-xpu').entry_points if e.name == 'nano-xpu').value == 'nanoxpu.cli:main'"
          nano-xpu serve --help
          python -m nanoxpu serve --help
          nano-xpu _worker --help
          nano-xpu serve plan -f "$RUNNER_TEMP/nano-examples/deployment/cluster-colocated.yaml"
          nano-xpu serve plan -f "$RUNNER_TEMP/nano-examples/deployment/cluster-pd.yaml"
      - name: Run all CPU tests
        run: python -m pytest -q tests --ignore=tests/integration --strict-markers --junitxml=artifacts/cpu-tests.xml --basetemp=artifacts/pytest
      - name: Reject empty or skipped CPU results
        if: ${{ always() }}
        run: python .github/ci/check_junit.py artifacts/cpu-tests.xml
      - name: Upload CPU evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/cpu-tests.xml
            artifacts/installed.txt
            artifacts/pytest/**/cpu-server.log
          if-no-files-found: error
          retention-days: 7

  cpu-integration:
    name: cpu integration (real router and SSH)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tests/requirements-cpu.txt
            .github/ci/requirements.txt
      - name: Install CPU integration prerequisites
        run: |
          mkdir -p artifacts
          printf 'NANO_XPU_ROUTER_BIN=%s/nano-router/vllm-router\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y openssh-server build-essential pkg-config libssl-dev protobuf-compiler cmake libclang-dev libzmq3-dev
          python -m pip install -r .github/ci/requirements.txt -r tests/requirements-cpu.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip freeze > artifacts/integration-installed.txt
          python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('torch', 'transformers', 'triton', 'flash_attn'))"
      - name: Build the pinned upstream router
        run: |
          python .github/ci/build_router.py --source "$RUNNER_TEMP/router-source" --output "$NANO_XPU_ROUTER_BIN" 2>&1 | tee artifacts/router-build.log
          cp "$NANO_XPU_ROUTER_BIN.source.json" "$NANO_XPU_ROUTER_BIN.help.txt" artifacts/
      - name: Run real router and SSH integration
        timeout-minutes: 15
        run: |
          python -m pytest -q tests/integration --strict-markers --junitxml=artifacts/cpu-integration.xml --basetemp=artifacts/integration-pytest
      - name: Reject empty or skipped integration results
        if: ${{ always() }}
        run: python .github/ci/check_junit.py artifacts/cpu-integration.xml
      - name: Upload integration evidence (never SSH keys or private state)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-integration-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/cpu-integration.xml
            artifacts/integration-installed.txt
            artifacts/router-build.log
            artifacts/vllm-router.source.json
            artifacts/vllm-router.help.txt
            artifacts/integration-pytest/**/*.log
          if-no-files-found: error
          retention-days: 7

  # Keep this name stable for branch protection; every required job belongs in needs.
  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [static, cpu, cpu-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every basic check to succeed
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          CPU_RESULT: ${{ needs.cpu.result }}
          INTEGRATION_RESULT: ${{ needs.cpu-integration.result }}
        run: |
          printf 'static=%s cpu=%s integration=%s\n' "$STATIC_RESULT" "$CPU_RESULT" "$INTEGRATION_RESULT"
          test "$STATIC_RESULT" = success && test "$CPU_RESULT" = success && test "$INTEGRATION_RESULT" = success
