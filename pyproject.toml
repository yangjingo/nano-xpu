[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-xpu"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "A lightweight LLM inference runtime derived from nano-vllm"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "xxhash",
]

[project.urls]
Homepage="https://github.com/yangjingo/nano-xpu"

[project.scripts]
nano-xpu = "nanoxpu.cli:main"

[project.optional-dependencies]
server = ["fastapi==0.136.3", "uvicorn==0.48.0", "pydantic==2.13.4"]
test = ["pytest==9.0.3", "httpx==0.28.1", "numpy", "xxhash"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nanoxpu*"]

[tool.ruff]
target-version = "py312"
extend-exclude = [".cpu-deps", ".venv-server"]

[tool.ruff.lint]
# Start with syntax and definite runtime errors; avoid unrelated style churn.
select = ["E9", "F63", "F7", "F82"]
