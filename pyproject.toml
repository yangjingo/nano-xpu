[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "xxhash",
]

[project.urls]
Homepage="https://github.com/GeeeekExplorer/nano-vllm"

[project.scripts]
nano-xpu = "nanovllm.cli:main"

[project.optional-dependencies]
server = ["fastapi==0.136.3", "uvicorn==0.48.0", "pydantic==2.13.4"]
test = ["pytest==9.0.3", "httpx==0.28.1", "numpy", "xxhash"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
